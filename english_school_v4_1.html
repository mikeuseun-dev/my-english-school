<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>나만의 영어 학교</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fc;color:#18233b;font-family:system-ui,'Noto Sans KR',sans-serif}header{background:#203a70;color:white;padding:25px 18px}header h1{margin:0 0 6px;font-size:26px}header p{margin:0;color:#d9e6ff}main{max-width:650px;margin:auto;padding:18px}.panel{background:white;border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:0 3px 16px #172b4d12}h2{font-size:19px;margin:0 0 14px}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.categories{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}button{font:inherit;cursor:pointer;border:1px solid #d4ddeb;background:#fff;border-radius:11px;padding:13px 8px;color:#203a70;font-weight:700}button.active{background:#254f9d;color:white;border-color:#254f9d}button:disabled{opacity:.55;cursor:default}.muted{color:#65748c;font-size:14px}.question{font-size:20px;line-height:1.6;white-space:pre-line;margin:14px 0}.answers{display:grid;gap:9px}.answers button{text-align:left;padding:14px}.answers button.correct{border-color:#15803d;background:#e8f7ed;color:#166534}.answers button.wrong{border-color:#c24141;background:#fff0f0;color:#991b1b}.explain{background:#f1f6ff;border-left:4px solid #3d6cbd;padding:14px;border-radius:8px;line-height:1.7;margin-top:15px}.primary{background:#254f9d;color:white;border-color:#254f9d;width:100%;margin-top:14px}.stats{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.hidden{display:none}.empty{padding:10px 0;color:#65748c}
.flashcard{width:100%;min-height:190px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:15px;background:linear-gradient(135deg,#e9f1ff,#f9fbff);border:2px solid #aac4f0;border-radius:18px;margin-top:18px;padding:22px}.flashcard span{font-size:clamp(28px,7vw,40px);overflow-wrap:anywhere;color:#203a70}.flashcard small{font-size:14px;color:#61728d;font-weight:400}.cardback{margin-top:12px;padding:16px;border-radius:12px;background:#f1f6ff;line-height:1.8}.cardback strong{font-size:22px}.cardActions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.cardActions button{font-size:14px;padding:12px 4px}#wordModePanel.hidden,#wordCardPanel.hidden{display:none}</style>

<style>
.lesson-progress{height:12px;border-radius:20px;background:#e4eaf5;overflow:hidden;margin:12px 0}
.lesson-progress>div{height:100%;background:#2d559d;transition:width .2s}
.lesson-step{font-size:14px;color:#52617b;font-weight:700}
.lesson-examples{padding-left:20px;line-height:1.8}
.lesson-examples li{margin-bottom:12px}
.lesson-examples small{display:block;color:#59657b}
.lesson-answers{display:grid;gap:10px}
.lesson-answers button{border:1px solid #cdd6e3;background:white;border-radius:12px;padding:14px;text-align:left;font-size:17px;color:#243c68;font-weight:650}
.lesson-answers button:disabled{opacity:1}
.lesson-answers button.correct{background:#e2f7e9;border-color:#27834b}
.lesson-answers button.wrong{background:#ffe8e7;border-color:#d95656}
.lesson-feedback{white-space:pre-line;padding:15px;background:#edf3fc;border-radius:12px;margin-top:12px}
.lesson-nav{display:flex;gap:8px;flex-wrap:wrap}
.lesson-nav button{flex:1;min-width:110px}
</style>
</head>
<body>
<header><h1>📘 나만의 영어 학교</h1><p>기초부터 고등 영어까지, 내 속도로 공부하기</p></header>
<main>
<section class="panel" id="todayLesson">
<h2>📘 오늘의 영어 수업</h2>
<p class="muted">개념 설명 → 예문 → 연습 문제 → 오답 확인 순서로 공부하세요.</p>
<div class="stats"><strong id="lessonTitle"></strong><span class="muted" id="lessonCount"></span></div>
<div class="lesson-progress"><div id="lessonBar"></div></div>
<p class="lesson-step" id="lessonStep"></p>
<div id="lessonContent"></div>
<div id="lessonAnswers" class="lesson-answers"></div>
<div id="lessonFeedback" class="lesson-feedback hidden"></div>
<div class="lesson-nav" style="margin-top:15px">
<button id="lessonBack">← 이전 단계</button><button class="primary" id="lessonNext">다음 단계 →</button>
</div>
<p class="muted" id="lessonSaved"></p>
</section>

<section class="panel"><h2>① 난이도 선택</h2><div class="choices" id="levels"><button class="active" data-level="기초">기초</button><button data-level="중등">중등</button><button data-level="고등">고등</button></div></section>
<section class="panel"><h2>② 공부할 과목 선택</h2><div class="categories" id="categories"><button class="active" data-cat="영단어">📗 영단어</button><button data-cat="영문법">📐 영문법</button><button data-cat="영어 독해">📖 영어 독해</button><button data-cat="오답 복습">🔁 오답 복습</button></div></section>
<section class="panel" id="wordModePanel"><h2>③ 영단어 공부 방법</h2><div class="categories" id="wordModes"><button class="active" data-mode="card">🗂️ 암기 카드</button><button data-mode="quiz">✏️ 4지선다 퀴즈</button></div><p class="muted" style="margin-bottom:0">먼저 카드를 보고 외운 뒤 퀴즈를 풀어보세요. 난이도마다 30단어가 있습니다.</p></section>
<section class="panel" id="wordCardPanel"><div class="stats"><strong id="cardHeading">기초 · 암기 카드</strong><span class="muted" id="cardCounter"></span></div><button id="flashcard" class="flashcard" aria-label="카드 뒤집기"><span id="cardWord"></span><small id="cardHint">터치하면 뜻과 예문이 나와요</small></button><div id="cardBack" class="cardback hidden"></div><div class="cardActions"><button id="prevCard">← 이전</button><button id="flipCard">뜻 보기</button><button id="nextCard">다음 →</button></div><button id="startQuiz" class="primary">이 단어들로 퀴즈 풀기 →</button></section>
<section class="panel"><div class="stats"><strong id="heading">기초 · 영단어</strong><span class="muted" id="counter"></span></div><div id="question" class="question"></div><div id="answers" class="answers"></div><div id="feedback" class="explain hidden"></div><button id="next" class="primary hidden">다음 문제 →</button></section>
<section class="panel"><h2>📊 학습 기록</h2><div id="stats" class="muted"></div><p class="muted">기록은 현재 브라우저에 저장됩니다. 브라우저 데이터를 삭제하거나 다른 기기를 사용하면 사라질 수 있어요.</p></section>
</main>
<script>
const questions=[
{level:'기초',cat:'영단어',q:'apple의 뜻은 무엇일까요?',a:['사과','의자','학교'],correct:0,why:'apple은 사과라는 뜻의 명사입니다. 예: I eat an apple. (나는 사과 하나를 먹는다.)'},
{level:'기초',cat:'영단어',q:'happy의 뜻은 무엇일까요?',a:['슬픈','행복한','피곤한'],correct:1,why:'happy는 행복한, 기쁜이라는 뜻의 형용사입니다.'},
{level:'기초',cat:'영문법',q:'빈칸에 알맞은 말은?\nI ___ a student.',a:['am','is','are'],correct:0,why:'주어가 I일 때 현재형 be동사는 am을 씁니다. He/She는 is, You/We/They는 are를 씁니다.'},
{level:'기초',cat:'영문법',q:'올바른 문장을 고르세요.',a:['She like cats.','She likes cats.','She liking cats.'],correct:1,why:'현재시제에서 주어가 She처럼 3인칭 단수이면 일반동사 like에 -s를 붙여 likes라고 씁니다.'},
{level:'기초',cat:'영어 독해',q:'I have a dog. It is small.\n어떤 동물을 키우나요?',a:['고양이','개','새'],correct:1,why:'I have a dog는 나는 개를 키운다는 뜻입니다. It is small은 그 개가 작다는 설명이에요.'},
{level:'기초',cat:'영어 독해',q:'Mina drinks water after running.\n미나는 언제 물을 마시나요?',a:['달리기 전','잠자기 전','달리기 후'],correct:2,why:'after는 ~한 후에라는 뜻입니다. after running은 달리기를 한 후에라는 의미입니다.'},
{level:'중등',cat:'영단어',q:'decide의 뜻은 무엇일까요?',a:['결정하다','잊어버리다','비교하다'],correct:0,why:'decide는 결정하다는 뜻입니다. decide to study는 공부하기로 결정하다는 의미예요.'},
{level:'중등',cat:'영단어',q:'environment의 뜻은 무엇일까요?',a:['경험','환경','발명'],correct:1,why:'environment는 환경입니다. protect the environment는 환경을 보호하다는 뜻이에요.'},
{level:'중등',cat:'영문법',q:'빈칸에 알맞은 말은?\nI have lived here ___ 2020.',a:['for','since','during'],correct:1,why:'since는 특정 시작 시점(2020년부터)을 나타냅니다. for는 for three years처럼 기간을 나타낼 때 씁니다.'},
{level:'중등',cat:'영문법',q:'빈칸에 알맞은 말은?\nIf it rains, I ___ at home.',a:['stay','will stay','stayed'],correct:1,why:'미래의 가능한 조건을 말할 때 If + 현재형, 주절에는 will + 동사원형을 자주 씁니다.'},
{level:'중등',cat:'영어 독해',q:'Jin missed the bus, so he walked to school.\n진이 걸어서 학교에 간 이유는?',a:['버스를 놓쳐서','운동을 좋아해서','학교가 가까워서'],correct:0,why:'missed the bus는 버스를 놓쳤다는 뜻입니다. so는 앞의 일로 인한 결과를 연결해 줍니다.'},
{level:'중등',cat:'영어 독해',q:'Although the test was difficult, Sora did not give up.\n소라는 어떻게 행동했나요?',a:['시험을 포기했다','시험을 미뤘다','포기하지 않았다'],correct:2,why:'Although는 비록 ~이지만이라는 뜻입니다. did not give up은 포기하지 않았다는 의미예요.'},
{level:'고등',cat:'영단어',q:'significant의 뜻으로 가장 알맞은 것은?',a:['사소한','중요한','일시적인'],correct:1,why:'significant는 중요한, 상당한이라는 뜻입니다. a significant change는 중요한 변화라는 의미입니다.'},
{level:'고등',cat:'영단어',q:'inevitable의 뜻으로 가장 알맞은 것은?',a:['불가피한','예상 밖의','독립적인'],correct:0,why:'inevitable은 피할 수 없는, 불가피한이라는 뜻입니다.'},
{level:'고등',cat:'영문법',q:'빈칸에 알맞은 말은?\nHad I known the truth, I ___ differently.',a:['act','will act','would have acted'],correct:2,why:'Had I known은 If I had known을 도치한 형태입니다. 과거 사실과 반대되는 가정이므로 would have + 과거분사를 씁니다.'},
{level:'고등',cat:'영문법',q:'어법상 올바른 문장은?',a:['Not only he was late but he forgot his book.','Not only was he late, but he also forgot his book.','Not only late he was but forgot his book.'],correct:1,why:'부정어 Not only가 문장 맨 앞에 오면 조동사나 be동사가 주어 앞으로 오는 도치가 일어납니다.'},
{level:'고등',cat:'영어 독해',q:'Technology can improve productivity. However, its benefits are not shared equally.\n글의 핵심은?',a:['기술의 혜택은 불균등하게 분배될 수 있다','기술은 언제나 해롭다','생산성은 중요하지 않다'],correct:0,why:'However는 역접을 나타냅니다. 첫 문장의 장점 뒤에 혜택이 평등하게 나뉘지 않는다는 한계를 제시합니다.'},
{level:'고등',cat:'영어 독해',q:'People often assume that more choices lead to greater satisfaction. Yet too many options can make decisions harder.\n필자의 주장은?',a:['선택지가 많을수록 언제나 좋다','선택은 불필요하다','선택지가 너무 많으면 결정이 어려워질 수 있다'],correct:2,why:'Yet은 앞의 통념과 반대되는 내용을 이끕니다. 핵심은 지나치게 많은 선택지가 결정에 부담을 준다는 것입니다.'}
];
const store='englishSchoolV2';
let saved;try{saved=JSON.parse(localStorage.getItem(store))||{}}catch(e){saved={}}
let missed=new Set(Array.isArray(saved.missed)?saved.missed:[]),attempts=Number(saved.attempts)||0,correctCount=Number(saved.correct)||0;
let level='기초',cat='영단어',position=0,answered=false,current=[];
const el=id=>document.getElementById(id);
function save(){try{localStorage.setItem(store,JSON.stringify({missed:[...missed],attempts,correct:correctCount}))}catch(e){}}
function updateStats(){el('stats').textContent=`총 ${attempts}문제 풀이 · 정답 ${correctCount}개 · 복습할 문제 ${missed.size}개`;}
function selectButtons(group,attribute,value){document.querySelectorAll(`#${group} button`).forEach(b=>b.classList.toggle('active',b.dataset[attribute]===value));}
function choose(){position=0;current=questions.map((q,i)=>({...q,id:i})).filter(q=>cat==='오답 복습'?missed.has(q.id):q.level===level&&q.cat===cat);render();}
function render(){answered=false;el('heading').textContent=cat==='오답 복습'?'오답 복습':`${level} · ${cat}`;el('feedback').classList.add('hidden');el('next').classList.add('hidden');el('answers').innerHTML='';updateStats();
if(!current.length){el('counter').textContent='';el('question').textContent=cat==='오답 복습'?'복습할 오답이 없습니다. 문제를 풀어보세요!':'준비된 문제가 없습니다.';return;}
if(position>=current.length){el('counter').textContent='완료';el('question').textContent='🎉 이번 학습을 마쳤습니다!';el('next').textContent='처음부터 다시 풀기';el('next').classList.remove('hidden');return;}
const q=current[position];el('counter').textContent=`${position+1} / ${current.length}`;el('question').textContent=q.q;
q.a.forEach((choice,i)=>{const b=document.createElement('button');b.textContent=`${i+1}. ${choice}`;b.onclick=()=>answer(i);el('answers').appendChild(b);});}
function answer(i){if(answered)return;answered=true;const q=current[position],right=i===q.correct;attempts++;if(right){correctCount++;missed.delete(q.id)}else missed.add(q.id);save();
[...el('answers').children].forEach((b,j)=>{b.disabled=true;if(j===q.correct)b.classList.add('correct');else if(j===i)b.classList.add('wrong');});
el('feedback').textContent=(right?'✅ 정답입니다!':'❌ 아쉬워요. 정답: '+q.a[q.correct])+'\n\n'+q.why;el('feedback').style.whiteSpace='pre-line';el('feedback').classList.remove('hidden');el('next').textContent='다음 문제 →';el('next').classList.remove('hidden');updateStats();}
el('levels').onclick=e=>{const b=e.target.closest('button');if(!b)return;level=b.dataset.level;selectButtons('levels','level',level);choose();};
el('categories').onclick=e=>{const b=e.target.closest('button');if(!b)return;cat=b.dataset.cat;selectButtons('categories','cat',cat);choose();};
el('next').onclick=()=>{if(position>=current.length){choose();return;}position++;render();};
choose();

": "English는 단수 취급하며 수동태 is spoken을 만듭니다."}, {"level": "중등", "title": "수동태 과거형", "sentence": "The window was broken.", "translation": "창문이 깨졌어요.", "explanation": "과거의 수동태는 was/were + 과거분사입니다.", "examples": [["The window was broken.", "창문이 깨졌어요."]], "question": "The letters ___ sent yesterday.", "options": ["was", "were", "are", "is"], "answer": 1, "feedback": "letters는 복수이고 yesterday는 과거이므로 were입니다."}, {"level": "중등", "title": "관계대명사 who", "sentence": "The man who lives here is kind.", "translation": "여기 사는 남자는 친절해요.", "explanation": "who는 사람을 설명하는 관계절을 연결합니다.", "examples": [["The man who lives here is kind.", "여기 사는 남자는 친절해요."]], "question": "The girl ___ called is my sister.", "options": ["which", "where", "who", "when"], "answer": 2, "feedback": "사람인 The girl을 꾸미므로 who가 알맞습니다."}, {"level": "중등", "title": "관계대명사 which", "sentence": "The book which I bought is new.", "translation": "내가 산 책은 새것이에요.", "explanation": "which는 사물을 설명하는 관계절에 사용합니다.", "examples": [["The book which I bought is new.", "내가 산 책은 새것이에요."]], "question": "The phone ___ I lost was expensive.", "options": ["who", "which", "where", "when"], "answer": 1, "feedback": "사물인 phone을 꾸미므로 which가 알맞습니다."}, {"level": "중등", "title": "간접의문문", "sentence": "I know where he lives.", "translation": "나는 그가 어디 사는지 알아요.", "explanation": "간접의문문에서는 보통 의문사 + 주어 + 동사 순서로 씁니다.", "examples": [["I know where he lives.", "나는 그가 어디 사는지 알아요."]], "question": "Do you know where she ___?", "options": ["live", "lives", "does live", "living"], "answer": 1, "feedback": "간접의문문은 where she lives 순서입니다."}, {"level": "중등", "title": "문장 연결과 독해", "sentence": "He was tired, but he kept working.", "translation": "그는 피곤했지만 계속 일했어요.", "explanation": "but은 앞뒤 내용을 대조합니다. 독해할 때 연결어의 역할을 확인하세요.", "examples": [["He was tired, but he kept working.", "그는 피곤했지만 계속 일했어요."]], "question": "He studied hard, ___ he passed the test.", "options": ["but", "so", "although", "unless"], "answer": 1, "feedback": "열심히 공부한 결과 시험에 합격했으므로 so가 알맞습니다."}, {"level": "고등", "title": "관계대명사 who", "sentence": "The girl who sings is my friend.", "translation": "노래하는 소녀는 내 친구예요.", "explanation": "who는 앞의 사람을 뒤에서 설명하는 절을 연결해요.", "examples": [["The man who called is here.", "전화한 남자가 여기 있어요."], ["I know a girl who speaks French.", "나는 프랑스어를 하는 소녀를 알아요."], ["People who exercise feel better.", "운동하는 사람들은 기분이 나아져요."]], "question": "The boy ___ helped me is kind.", "options": ["which", "who", "where", "when"], "answer": 1, "feedback": "사람인 The boy를 꾸미고 주어 역할을 하므로 who가 알맞습니다."}, {"level": "고등", "title": "가정법 과거", "sentence": "If I had time, I would travel.", "translation": "시간이 있다면 여행할 텐데.", "explanation": "현재 사실과 다른 상황을 상상할 때 If + 과거형, would + 동사원형을 자주 써요.", "examples": [["If I were rich, I would help.", "부자라면 도울 텐데."], ["If she knew, she would tell us.", "안다면 우리에게 말할 텐데."], ["If I had a car, I would drive.", "차가 있다면 운전할 텐데."]], "question": "If I ___ taller, I would play basketball.", "options": ["am", "will be", "were", "be"], "answer": 2, "feedback": "현재 사실과 다른 가정이므로 were를 사용할 수 있습니다."}, {"level": "고등", "title": "분사구문 기초", "sentence": "Feeling tired, I went home.", "translation": "피곤해서 나는 집에 갔어요.", "explanation": "분사구문은 두 문장의 관계를 짧게 나타내는 방법이에요. 여기서는 이유를 나타냅니다.", "examples": [["Feeling sick, she stayed home.", "아파서 그녀는 집에 있었어요."], ["Walking home, I saw a cat.", "집에 걸어가다가 고양이를 봤어요."], ["Knowing the answer, he smiled.", "답을 알아서 그는 웃었어요."]], "question": "___ tired, she went to bed early.", "options": ["Feel", "Felt", "Feels", "Feeling"], "answer": 3, "feedback": "주어가 피곤함을 느끼는 상태를 나타내므로 Feeling이 알맞습니다."}, {"level": "고등", "title": "양보 접속사 although", "sentence": "Although it was cold, we went out.", "translation": "추웠지만 우리는 밖에 나갔어요.", "explanation": "although는 앞뒤 내용이 예상과 다르게 이어질 때 쓰는 '비록 ~이지만'이라는 뜻이에요.", "examples": [["Although I was tired, I studied.", "피곤했지만 공부했어요."], ["Although it rained, we walked.", "비가 왔지만 걸었어요."], ["Although it is hard, I will try.", "어렵지만 시도할 거예요."]], "question": "___ it was raining, we went outside.", "options": ["Because", "Although", "So", "Unless"], "answer": 1, "feedback": "비가 왔는데도 나갔다는 대조를 나타내므로 Although가 알맞습니다."}];
const lessonKey='englishSchoolV4Lessons';
let lessonState={};
try { lessonState=JSON.parse(localStorage.getItem(lessonKey))||{}; }catch(e){}
let lessonStep=0,lessonAnswered=false;
const lessonEl=id=>document.getElementById(id);
const lessonList=()=>lessonData.filter(x=>x.level===level);
const lessonStorageKey=()=>level;
function lessonSave(){
 try{localStorage.setItem(lessonKey,JSON.stringify(lessonState))}catch(e){}
}
function lessonCurrentIndex(){
 const x=lessonState[lessonStorageKey()]||{};
 return Math.min(x.index||0,lessonList().length-1);
}
function lessonRender(){
 const items=lessonList(),idx=lessonCurrentIndex(),item=items[idx];
 lessonEl('lessonTitle').textContent=`${level} · ${item.title}`;
 lessonEl('lessonCount').textContent=`${idx+1} / ${items.length}과`;
 lessonEl('lessonBar').style.width=((idx+1)/items.length*100)+'%';
 lessonEl('lessonStep').textContent=['① 개념 설명','② 예문 익히기','③ 연습 문제','④ 결과 및 복습'][lessonStep];
 const content=lessonEl('lessonContent'),ans=lessonEl('lessonAnswers'),fb=lessonEl('lessonFeedback');
 content.replaceChildren();ans.replaceChildren();fb.classList.add('hidden');
 const p=(text,tag='p')=>{const node=document.createElement(tag);node.textContent=text;content.append(node)};
 if(lessonStep===0){
  p(item.sentence,'h3');p(item.translation);p(item.explanation);
 } else if(lessonStep===1){
  p('영어 문장과 뜻을 천천히 읽어보세요.');
  const ul=document.createElement('ol');ul.className='lesson-examples';
  item.examples.forEach(([en,ko])=>{const li=document.createElement('li');li.textContent=en;const sm=document.createElement('small');sm.textContent=ko;li.append(sm);ul.append(li)});content.append(ul);
 }else if(lessonStep===2){
  p(item.question,'h3');
  item.options.forEach((v,i)=>{const b=document.createElement('button');b.textContent=(i+1)+'. '+v;b.onclick=()=>{
   if(lessonAnswered)return;lessonAnswered=true;
   [...ans.children].forEach((x,j)=>{x.disabled=true;if(j===item.answer)x.classList.add('correct');else if(j===i)x.classList.add('wrong')});
   const ok=i===item.answer;
   fb.textContent=(ok?'✅ 정답입니다!':'❌ 정답: '+item.options[item.answer])+'\n'+item.feedback;
   fb.classList.remove('hidden');
   const state=lessonState[lessonStorageKey()]||{index:idx,missed:[]};
   if(!Array.isArray(state.missed))state.missed=[];
   if(ok)state.missed=state.missed.filter(n=>n!==idx);
   else if(!state.missed.includes(idx))state.missed.push(idx);
   state.answered=(state.answered||0)+1;state.correct=(state.correct||0)+(ok?1:0);
   lessonState[lessonStorageKey()]=state;lessonSave();
   lessonEl('lessonNext').disabled=false;
  };ans.append(b)});
 }else{
  const state=lessonState[lessonStorageKey()]||{};
  p('오늘의 수업을 마쳤어요! 🎉','h3');
  p('이번 과에서 배운 문장: '+item.sentence);
  p('틀렸다면 이전 단계로 돌아가 다시 풀어보세요.');
  p(`이 난이도 누적 정답: ${state.correct||0} / ${state.answered||0}회`);
 }
 lessonEl('lessonBack').disabled=lessonStep===0;
 lessonEl('lessonNext').disabled=lessonStep===2&&!lessonAnswered;
 lessonEl('lessonNext').textContent=lessonStep===3?(idx===items.length-1?'처음 과로 돌아가기 →':'다음 과 시작 →'):'다음 단계 →';
 lessonEl('lessonSaved').textContent='진도는 현재 브라우저에 자동 저장됩니다.';
}
lessonEl('lessonBack').onclick=()=>{if(lessonStep>0){lessonStep--;lessonAnswered=false;lessonRender()}};
lessonEl('lessonNext').onclick=()=>{
 if(lessonStep<3)lessonStep++;
 else{
  const state=lessonState[lessonStorageKey()]||{missed:[]};
  state.index=(lessonCurrentIndex()+1)%lessonList().length;
  lessonState[lessonStorageKey()]=state;lessonSave();lessonStep=0;
 }
 lessonAnswered=false;lessonRender();
};
lessonEl('levels').addEventListener('click',()=>{lessonStep=0;lessonAnswered=false;lessonRender()});
lessonRender();
</script>
