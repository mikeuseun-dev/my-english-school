<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>나만의 영어 학교</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fc;color:#18233b;font-family:system-ui,'Noto Sans KR',sans-serif}header{background:#203a70;color:white;padding:25px 18px}header h1{margin:0 0 6px;font-size:26px}header p{margin:0;color:#d9e6ff}main{max-width:650px;margin:auto;padding:18px}.panel{background:white;border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:0 3px 16px #172b4d12}h2{font-size:19px;margin:0 0 14px}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.categories{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}button{font:inherit;cursor:pointer;border:1px solid #d4ddeb;background:#fff;border-radius:11px;padding:13px 8px;color:#203a70;font-weight:700}button.active{background:#254f9d;color:white;border-color:#254f9d}button:disabled{opacity:.55;cursor:default}.muted{color:#65748c;font-size:14px}.question{font-size:20px;line-height:1.6;white-space:pre-line;margin:14px 0}.answers{display:grid;gap:9px}.answers button{text-align:left;padding:14px}.answers button.correct{border-color:#15803d;background:#e8f7ed;color:#166534}.answers button.wrong{border-color:#c24141;background:#fff0f0;color:#991b1b}.explain{background:#f1f6ff;border-left:4px solid #3d6cbd;padding:14px;border-radius:8px;line-height:1.7;margin-top:15px}.primary{background:#254f9d;color:white;border-color:#254f9d;width:100%;margin-top:14px}.stats{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.hidden{display:none}.empty{padding:10px 0;color:#65748c}
.flashcard{width:100%;min-height:190px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:15px;background:linear-gradient(135deg,#e9f1ff,#f9fbff);border:2px solid #aac4f0;border-radius:18px;margin-top:18px;padding:22px}.flashcard span{font-size:clamp(28px,7vw,40px);overflow-wrap:anywhere;color:#203a70}.flashcard small{font-size:14px;color:#61728d;font-weight:400}.cardback{margin-top:12px;padding:16px;border-radius:12px;background:#f1f6ff;line-height:1.8}.cardback strong{font-size:22px}.cardActions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.cardActions button{font-size:14px;padding:12px 4px}#wordModePanel.hidden,#wordCardPanel.hidden{display:none}</style>
</head>
<body>
<header><h1>📘 나만의 영어 학교</h1><p>기초부터 고등 영어까지, 내 속도로 공부하기</p></header>
<main>
<section class="panel"><h2>① 난이도 선택</h2><div class="choices" id="levels"><button class="active" data-level="기초">기초</button><button data-level="중등">중등</button><button data-level="고등">고등</button></div></section>
<section class="panel"><h2>② 공부할 과목 선택</h2><div class="categories" id="categories"><button class="active" data-cat="영단어">📗 영단어</button><button data-cat="영문법">📐 영문법</button><button data-cat="영어 독해">📖 영어 독해</button><button data-cat="오답 복습">🔁 오답 복습</button></div></section>
<section class="panel" id="wordModePanel"><h2>③ 영단어 공부 방법</h2><div class="categories" id="wordModes"><button class="active" data-mode="card">🗂️ 암기 카드</button><button data-mode="quiz">✏️ 4지선다 퀴즈</button></div><p class="muted" style="margin-bottom:0">먼저 카드를 보고 외운 뒤 퀴즈를 풀어보세요. 난이도마다 30단어가 있습니다.</p></section>
<section class="panel" id="wordCardPanel"><div class="stats"><strong id="cardHeading">기초 · 암기 카드</strong><span class="muted" id="cardCounter"></span></div><button id="flashcard" class="flashcard" aria-label="카드 뒤집기"><span id="cardWord"></span><small id="cardHint">터치하면 뜻과 예문이 나와요</small></button><div id="cardBack" class="cardback hidden"></div><div class="cardActions"><button id="prevCard">← 이전</button><button id="flipCard">뜻 보기</button><button id="nextCard">다음 →</button></div><button id="startQuiz" class="primary">이 단어들로 퀴즈 풀기 →</button></section>
<section class="panel"><div class="stats"><strong id="heading">기초 · 영단어</strong><span class="muted" id="counter"></span></div><div id="question" class="question"></div><div id="answers" class="answers"></div><div id="feedback" class="explain hidden"></div><button id="next" class="primary hidden">다음 문제 →</button></section>
<section class="panel"><h2>📊 학습 기록</h2><div id="stats" class="muted"></div><p class="muted">기록은 현재 브라우저에 저장됩니다. 브라우저 데이터를 삭제하거나 다른 기기를 사용하면 사라질 수 있어요.</p></section>
</main>
<script>
const questions=[
{level:'기초',cat:'영단어',q:'apple의 뜻은 무엇일까요?',a:['사과','의자','학교'],correct:0,why:'apple은 사과라는 뜻의 명사입니다. 예: I eat an apple. (나는 사과 하나를 먹는다.)'},
{level:'기초',cat:'영단어',q:'happy의 뜻은 무엇일까요?',a:['슬픈','행복한','피곤한'],correct:1,why:'happy는 행복한, 기쁜이라는 뜻의 형용사입니다.'},
{level:'기초',cat:'영문법',q:'빈칸에 알맞은 말은?\nI ___ a student.',a:['am','is','are'],correct:0,why:'주어가 I일 때 현재형 be동사는 am을 씁니다. He/She는 is, You/We/They는 are를 씁니다.'},
{level:'기초',cat:'영문법',q:'올바른 문장을 고르세요.',a:['She like cats.','She likes cats.','She liking cats.'],correct:1,why:'현재시제에서 주어가 She처럼 3인칭 단수이면 일반동사 like에 -s를 붙여 likes라고 씁니다.'},
{level:'기초',cat:'영어 독해',q:'I have a dog. It is small.\n어떤 동물을 키우나요?',a:['고양이','개','새'],correct:1,why:'I have a dog는 나는 개를 키운다는 뜻입니다. It is small은 그 개가 작다는 설명이에요.'},
{level:'기초',cat:'영어 독해',q:'Mina drinks water after running.\n미나는 언제 물을 마시나요?',a:['달리기 전','잠자기 전','달리기 후'],correct:2,why:'after는 ~한 후에라는 뜻입니다. after running은 달리기를 한 후에라는 의미입니다.'},
{level:'중등',cat:'영단어',q:'decide의 뜻은 무엇일까요?',a:['결정하다','잊어버리다','비교하다'],correct:0,why:'decide는 결정하다는 뜻입니다. decide to study는 공부하기로 결정하다는 의미예요.'},
{level:'중등',cat:'영단어',q:'environment의 뜻은 무엇일까요?',a:['경험','환경','발명'],correct:1,why:'environment는 환경입니다. protect the environment는 환경을 보호하다는 뜻이에요.'},
{level:'중등',cat:'영문법',q:'빈칸에 알맞은 말은?\nI have lived here ___ 2020.',a:['for','since','during'],correct:1,why:'since는 특정 시작 시점(2020년부터)을 나타냅니다. for는 for three years처럼 기간을 나타낼 때 씁니다.'},
{level:'중등',cat:'영문법',q:'빈칸에 알맞은 말은?\nIf it rains, I ___ at home.',a:['stay','will stay','stayed'],correct:1,why:'미래의 가능한 조건을 말할 때 If + 현재형, 주절에는 will + 동사원형을 자주 씁니다.'},
{level:'중등',cat:'영어 독해',q:'Jin missed the bus, so he walked to school.\n진이 걸어서 학교에 간 이유는?',a:['버스를 놓쳐서','운동을 좋아해서','학교가 가까워서'],correct:0,why:'missed the bus는 버스를 놓쳤다는 뜻입니다. so는 앞의 일로 인한 결과를 연결해 줍니다.'},
{level:'중등',cat:'영어 독해',q:'Although the test was difficult, Sora did not give up.\n소라는 어떻게 행동했나요?',a:['시험을 포기했다','시험을 미뤘다','포기하지 않았다'],correct:2,why:'Although는 비록 ~이지만이라는 뜻입니다. did not give up은 포기하지 않았다는 의미예요.'},
{level:'고등',cat:'영단어',q:'significant의 뜻으로 가장 알맞은 것은?',a:['사소한','중요한','일시적인'],correct:1,why:'significant는 중요한, 상당한이라는 뜻입니다. a significant change는 중요한 변화라는 의미입니다.'},
{level:'고등',cat:'영단어',q:'inevitable의 뜻으로 가장 알맞은 것은?',a:['불가피한','예상 밖의','독립적인'],correct:0,why:'inevitable은 피할 수 없는, 불가피한이라는 뜻입니다.'},
{level:'고등',cat:'영문법',q:'빈칸에 알맞은 말은?\nHad I known the truth, I ___ differently.',a:['act','will act','would have acted'],correct:2,why:'Had I known은 If I had known을 도치한 형태입니다. 과거 사실과 반대되는 가정이므로 would have + 과거분사를 씁니다.'},
{level:'고등',cat:'영문법',q:'어법상 올바른 문장은?',a:['Not only he was late but he forgot his book.','Not only was he late, but he also forgot his book.','Not only late he was but forgot his book.'],correct:1,why:'부정어 Not only가 문장 맨 앞에 오면 조동사나 be동사가 주어 앞으로 오는 도치가 일어납니다.'},
{level:'고등',cat:'영어 독해',q:'Technology can improve productivity. However, its benefits are not shared equally.\n글의 핵심은?',a:['기술의 혜택은 불균등하게 분배될 수 있다','기술은 언제나 해롭다','생산성은 중요하지 않다'],correct:0,why:'However는 역접을 나타냅니다. 첫 문장의 장점 뒤에 혜택이 평등하게 나뉘지 않는다는 한계를 제시합니다.'},
{level:'고등',cat:'영어 독해',q:'People often assume that more choices lead to greater satisfaction. Yet too many options can make decisions harder.\n필자의 주장은?',a:['선택지가 많을수록 언제나 좋다','선택은 불필요하다','선택지가 너무 많으면 결정이 어려워질 수 있다'],correct:2,why:'Yet은 앞의 통념과 반대되는 내용을 이끕니다. 핵심은 지나치게 많은 선택지가 결정에 부담을 준다는 것입니다.'}
];
const store='englishSchoolV2';
let saved;try{saved=JSON.parse(localStorage.getItem(store))||{}}catch(e){saved={}}
let missed=new Set(Array.isArray(saved.missed)?saved.missed:[]),attempts=Number(saved.attempts)||0,correctCount=Number(saved.correct)||0;
let level='기초',cat='영단어',position=0,answered=false,current=[];
const el=id=>document.getElementById(id);
function save(){try{localStorage.setItem(store,JSON.stringify({missed:[...missed],attempts,correct:correctCount}))}catch(e){}}
function updateStats(){el('stats').textContent=`총 ${attempts}문제 풀이 · 정답 ${correctCount}개 · 복습할 문제 ${missed.size}개`;}
function selectButtons(group,attribute,value){document.querySelectorAll(`#${group} button`).forEach(b=>b.classList.toggle('active',b.dataset[attribute]===value));}
function choose(){position=0;current=questions.map((q,i)=>({...q,id:i})).filter(q=>cat==='오답 복습'?missed.has(q.id):q.level===level&&q.cat===cat);render();}
function render(){answered=false;el('heading').textContent=cat==='오답 복습'?'오답 복습':`${level} · ${cat}`;el('feedback').classList.add('hidden');el('next').classList.add('hidden');el('answers').innerHTML='';updateStats();
if(!current.length){el('counter').textContent='';el('question').textContent=cat==='오답 복습'?'복습할 오답이 없습니다. 문제를 풀어보세요!':'준비된 문제가 없습니다.';return;}
if(position>=current.length){el('counter').textContent='완료';el('question').textContent='🎉 이번 학습을 마쳤습니다!';el('next').textContent='처음부터 다시 풀기';el('next').classList.remove('hidden');return;}
const q=current[position];el('counter').textContent=`${position+1} / ${current.length}`;el('question').textContent=q.q;
q.a.forEach((choice,i)=>{const b=document.createElement('button');b.textContent=`${i+1}. ${choice}`;b.onclick=()=>answer(i);el('answers').appendChild(b);});}
function answer(i){if(answered)return;answered=true;const q=current[position],right=i===q.correct;attempts++;if(right){correctCount++;missed.delete(q.id)}else missed.add(q.id);save();
[...el('answers').children].forEach((b,j)=>{b.disabled=true;if(j===q.correct)b.classList.add('correct');else if(j===i)b.classList.add('wrong');});
el('feedback').textContent=(right?'✅ 정답입니다!':'❌ 아쉬워요. 정답: '+q.a[q.correct])+'\n\n'+q.why;el('feedback').style.whiteSpace='pre-line';el('feedback').classList.remove('hidden');el('next').textContent='다음 문제 →';el('next').classList.remove('hidden');updateStats();}
el('levels').onclick=e=>{const b=e.target.closest('button');if(!b)return;level=b.dataset.level;selectButtons('levels','level',level);choose();};
el('categories').onclick=e=>{const b=e.target.closest('button');if(!b)return;cat=b.dataset.cat;selectButtons('categories','cat',cat);choose();};
el('next').onclick=()=>{if(position>=current.length){choose();return;}position++;render();};
choose();

const vocab=[{"level":"기초","word":"apple","meaning":"사과","example":"I eat an apple.","translation":"나는 사과를 먹는다."},{"level":"기초","word":"happy","meaning":"행복한","example":"She is happy.","translation":"그녀는 행복하다."},{"level":"기초","word":"book","meaning":"책","example":"This is my book.","translation":"이것은 내 책이다."},{"level":"기초","word":"water","meaning":"물","example":"I drink water.","translation":"나는 물을 마신다."},{"level":"기초","word":"school","meaning":"학교","example":"I go to school.","translation":"나는 학교에 간다."},{"level":"기초","word":"friend","meaning":"친구","example":"He is my friend.","translation":"그는 내 친구다."},{"level":"기초","word":"family","meaning":"가족","example":"I love my family.","translation":"나는 가족을 사랑한다."},{"level":"기초","word":"morning","meaning":"아침","example":"Good morning!","translation":"좋은 아침이에요!"},{"level":"기초","word":"small","meaning":"작은","example":"The bag is small.","translation":"그 가방은 작다."},{"level":"기초","word":"beautiful","meaning":"아름다운","example":"The flower is beautiful.","translation":"그 꽃은 아름답다."},{"level":"기초","word":"listen","meaning":"듣다","example":"Listen to the music.","translation":"음악을 들어라."},{"level":"기초","word":"write","meaning":"쓰다","example":"I write a letter.","translation":"나는 편지를 쓴다."},{"level":"기초","word":"read","meaning":"읽다","example":"I read every day.","translation":"나는 매일 읽는다."},{"level":"기초","word":"learn","meaning":"배우다","example":"We learn English.","translation":"우리는 영어를 배운다."},{"level":"기초","word":"question","meaning":"질문","example":"I have a question.","translation":"질문이 있어요."},{"level":"기초","word":"answer","meaning":"대답","example":"I know the answer.","translation":"나는 답을 안다."},{"level":"기초","word":"before","meaning":"~전에","example":"Wash your hands before dinner.","translation":"저녁 식사 전에 손을 씻어라."},{"level":"기초","word":"after","meaning":"~후에","example":"I rest after work.","translation":"나는 일한 후 쉰다."},{"level":"기초","word":"because","meaning":"~때문에","example":"I stayed home because it rained.","translation":"비가 와서 집에 있었다."},{"level":"기초","word":"always","meaning":"항상","example":"I always eat breakfast.","translation":"나는 항상 아침을 먹는다."},{"level":"기초","word":"sometimes","meaning":"가끔","example":"I sometimes walk home.","translation":"나는 가끔 걸어서 집에 간다."},{"level":"기초","word":"usually","meaning":"보통","example":"I usually get up early.","translation":"나는 보통 일찍 일어난다."},{"level":"기초","word":"important","meaning":"중요한","example":"Sleep is important.","translation":"잠은 중요하다."},{"level":"기초","word":"different","meaning":"다른","example":"We have different ideas.","translation":"우리는 다른 생각을 갖고 있다."},{"level":"기초","word":"enjoy","meaning":"즐기다","example":"I enjoy reading.","translation":"나는 독서를 즐긴다."},{"level":"기초","word":"practice","meaning":"연습하다","example":"Practice every day.","translation":"매일 연습해라."},{"level":"기초","word":"remember","meaning":"기억하다","example":"Remember this word.","translation":"이 단어를 기억해라."},{"level":"기초","word":"forget","meaning":"잊다","example":"Do not forget your bag.","translation":"가방을 잊지 마라."},{"level":"기초","word":"begin","meaning":"시작하다","example":"The class begins at nine.","translation":"수업은 9시에 시작한다."},{"level":"기초","word":"finish","meaning":"끝내다","example":"I finish my homework.","translation":"나는 숙제를 끝낸다."},{"level":"중등","word":"decide","meaning":"결정하다","example":"I decided to study.","translation":"나는 공부하기로 결정했다."},{"level":"중등","word":"environment","meaning":"환경","example":"We protect the environment.","translation":"우리는 환경을 보호한다."},{"level":"중등","word":"experience","meaning":"경험","example":"It was a new experience.","translation":"그것은 새로운 경험이었다."},{"level":"중등","word":"compare","meaning":"비교하다","example":"Compare these two pictures.","translation":"이 두 그림을 비교해라."},{"level":"중등","word":"explain","meaning":"설명하다","example":"Please explain the rule.","translation":"규칙을 설명해 주세요."},{"level":"중등","word":"reason","meaning":"이유","example":"What is the reason?","translation":"이유가 무엇인가요?"},{"level":"중등","word":"result","meaning":"결과","example":"The result surprised me.","tr xample":"Technology can facilitate learning.","translation":"기술은 학습을 촉진할 수 있다."},{"level":"고등","word":"inhibit","meaning":"억제하다, 방해하다","example":"Fear can inhibit creativity.","translation":"두려움은 창의성을 억제할 수 있다."},{"level":"고등","word":"perceive","meaning":"인식하다","example":"People perceive risk differently.","translation":"사람들은 위험을 다르게 인식한다."},{"level":"고등","word":"perspective","meaning":"관점","example":"Consider another perspective.","translation":"다른 관점을 고려해라."},{"level":"고등","word":"contradict","meaning":"모순되다, 반박하다","example":"The evidence contradicts the claim.","translation":"증거는 그 주장을 반박한다."},{"level":"고등","word":"consistent","meaning":"일관된","example":"Her answers were consistent.","translation":"그녀의 대답은 일관됐다."},{"level":"고등","word":"substantial","meaning":"상당한","example":"The plan needs substantial effort.","translation":"그 계획에는 상당한 노력이 필요하다."},{"level":"고등","word":"crucial","meaning":"결정적인, 매우 중요한","example":"Timing is crucial.","translation":"시기가 매우 중요하다."},{"level":"고등","word":"relevant","meaning":"관련 있는","example":"Find relevant information.","translation":"관련 있는 정보를 찾아라."},{"level":"고등","word":"objective","meaning":"객관적인","example":"We need an objective view.","translation":"우리는 객관적인 시각이 필요하다."},{"level":"고등","word":"subjective","meaning":"주관적인","example":"Taste is subjective.","translation":"취향은 주관적이다."},{"level":"고등","word":"complex","meaning":"복잡한","example":"It is a complex issue.","translation":"그것은 복잡한 문제다."},{"level":"고등","word":"comprehensive","meaning":"포괄적인","example":"We need a comprehensive plan.","translation":"우리는 포괄적인 계획이 필요하다."},{"level":"고등","word":"ambiguous","meaning":"모호한","example":"The sentence is ambiguous.","translation":"그 문장은 모호하다."},{"level":"고등","word":"implicit","meaning":"암묵적인","example":"The message was implicit.","translation":"그 메시지는 암묵적이었다."},{"level":"고등","word":"explicit","meaning":"명시적인","example":"The rules are explicit.","translation":"규칙은 명시적이다."},{"level":"고등","word":"allocate","meaning":"배분하다","example":"We must allocate resources.","translation":"우리는 자원을 배분해야 한다."},{"level":"고등","word":"prioritize","meaning":"우선순위를 정하다","example":"Prioritize important tasks.","translation":"중요한 일에 우선순위를 정해라."},{"level":"고등","word":"sustainable","meaning":"지속 가능한","example":"We need sustainable growth.","translation":"우리는 지속 가능한 성장이 필요하다."},{"level":"고등","word":"undermine","meaning":"약화시키다","example":"Distrust can undermine cooperation.","translation":"불신은 협력을 약화시킬 수 있다."},{"level":"고등","word":"implication","meaning":"함축, 영향","example":"Consider the implications.","translation":"그 함축된 의미와 영향을 고려해라."}];
const vocabKey='englishSchoolV3';
let progress={missed:[],attempts:0,correct:0};
try{const obj=JSON.parse(localStorage.getItem(vocabKey));if(obj&&typeof obj==='object')progress={...progress,...obj}}catch(e){}
let wordMode='card',cardIndex=0,cardRevealed=false,quizIndex=0,quizAnswered=false,quizList=[];
const wordItems=()=>vocab.filter(v=>v.level===level);
const vocabMissed=()=>new Set(Array.isArray(progress.missed)?progress.missed:[]);
function saveV3(){try{localStorage.setItem(vocabKey,JSON.stringify(progress))}catch(e){}}
function pickOptions(item){const pool=vocab.filter(v=>v.level===item.level&&v.word!==item.word);const idx=vocab.findIndex(v=>v.word===item.word);const others=[pool[(idx*7+3)%pool.length],pool[(idx*11+9)%pool.length],pool[(idx*13+15)%pool.length]];let options=[item,...others];if(new Set(options.map(x=>x.word)).size<4){options=[item,...pool.filter((x,i,a)=>a.findIndex(z=>z.word===x.word)===i).slice(0,3)];}const shift=idx%4;options=[...options.slice(shift),...options.slice(0,shift)];return options;}
function showCard(){const list=wordItems();const v=list[cardIndex%list.length];el('cardHeading').textContent=level+' · 암기 카드';el('cardCounter').textContent=(cardIndex+1)+' / '+list.length;el('cardWord').textContent=v.word;el('cardBack').classList.toggle('hidden',!cardRevealed);el('cardBack').replaceChildren();if(cardRevealed){const title=document.createElement('strong');title.textContent=v.meaning;const ex=document.createElement('p');ex.textContent=v.example;const tr=document.createElement('p');tr.textContent=v.translation;el('cardBack').append(title,ex,tr);}el('cardHint').textContent=cardRevealed?'다시 터치하면 뜻을 가려요':'터치하면 뜻과 예문이 나와요';el('flipCard').textContent=cardRevealed?'뜻 가리기':'뜻 보기';}

el('flashcard').onclick=flip;el('flipCard').onclick=flip;

function startWordQuiz(review=false){wordMode='quiz';selectButtons('wordModes','mode','quiz');quizIndex=0;quizList=review?vocab.filter(v=>vocabMissed().has(v.word)):wordItems();renderVocabQuiz()}
function renderVocabQuiz(){quizAnswered=false;el('feedback').classList.add('hidden');el('next').classList.add('hidden');el('answers').replaceChildren();el('heading').textContent=cat==='오답 복습'?'영단어 · 오답 복습':level+' · 영단어 퀴즈';if(!quizList.length){el('counter').textContent='';el('question').textContent='복습할 영단어가 없습니다.';return;}if(quizIndex>=quizList.length){el('counter').textContent='완료';el('question').textContent='🎉 영단어 학습을 마쳤습니다!';el('next').textContent='다시 풀기';el('next').classList.remove('hidden');return;}const item=quizList[quizIndex];el('counter').textContent=(quizIndex+1)+' / '+quizList.length;el('question').textContent=item.word+'의 뜻은 무엇일까요?';const options=pickOptions(item);options.forEach((opt,i)=>{const b=document.createElement('button');b.textContent=(i+1)+'. '+opt.meaning;b.onclick=()=>{if(quizAnswered)return;quizAnswered=true;const right=opt.word===item.word;progress.attempts++;if(right){progress.correct++;progress.missed=progress.missed.filter(x=>x!==item.word)}else{if(!progress.missed.includes(item.word))progress.missed.push(item.word)}saveV3();[...el('answers').children].forEach((node,j)=>{node.disabled=true;if(options[j].word===item.word)node.classList.add('correct');else if(j===i)node.classList.add('wrong')});el('feedback').textContent=(right?'✅ 정답입니다!':'❌ 정답은 '+item.meaning+'입니다.')+'\n\n'+item.word+' = '+item.meaning+'\n'+item.example+'\n'+item.translation;el('feedback').style.whiteSpace='pre-line';el('feedback').classList.remove('hidden');el('next').textContent='다음 문제 →';el('next').classList.remove('hidden');updateV3Stats();};el('answers').appendChild(b)});}
function updateV3Stats(){const old=el('v3stats');if(old)old.textContent='영단어 퀴즈 '+progress.attempts+'회 풀이 · 정답 '+progress.correct+'회 · 복습할 영단어 '+progress.missed.length+'개';}
const statDiv=document.createElement('p');statDiv.id='v3stats';statDiv.className='muted';el('stats').after(statDiv);
const oldChoose=choose;
choose=function(){el('wordModePanel').classList.toggle('hidden',cat!=='영단어');el('wordCardPanel').classList.toggle('hidden',cat!=='영단어'||wordMode!=='card');el('heading').parentElement.parentElement.classList.toggle('hidden',cat==='영단어'&&wordMode==='card');if(cat==='영단어'){if(wordMode==='card'){cardIndex=0;cardRevealed=false;showCard()}else startWordQuiz()}else if(cat==='오답 복습'&&progress.missed.length){el('wordModePanel').classList.add('hidden');el('wordCardPanel').classList.add('hidden');el('heading').parentElement.parentElement.classList.remove('hidden');startWordQuiz(true)}else{oldChoose()}updateV3Stats();};
el('wordModes').onclick=e=>{const b=e.target.closest('button');if(!b)return;wordMode=b.dataset.mode;selectButtons('wordModes','mode',wordMode);choose()};
el('startQuiz').onclick=()=>{wordMode='quiz';selectButtons('wordModes','mode','quiz');choose()};
const oldNext=el('next').onclick;
el('next').onclick=()=>{if((cat==='영단어'&&wordMode==='quiz')||(cat==='오답 복습'&&quizList.length&&progress.missed.length)){if(quizIndex>=quizList.length){quizIndex=0}else{quizIndex++}renderVocabQuiz()}else oldNext()};
choose();
